[project]
name = "elynt-helper"
version = "0.1.0"
description = "Local Python/CUDA helper for Elynt Music Tool: the app spawns it and talks to it over stdio (ADR 0001, ADR 0003)."
# Pinned to 3.12: pyebur128 and the analysis stack are built for it.
requires-python = ">=3.12,<3.13"
dependencies = [
  "soundfile>=0.13",
]

[dependency-groups]
dev = ["pytest>=8"]

# PyTorch is not listed here: it comes from PyTorch's own CUDA 12.8 index, which the
# setup scripts install with `uv pip install` after `uv sync --inexact` (see helper/README.md).
# Keeping it out of the lockfile keeps CI and the lock small.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elynt_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
